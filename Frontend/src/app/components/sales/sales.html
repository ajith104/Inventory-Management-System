<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Sales</h2>

        <button
            type="button"
            class="btn btn-primary"
            (click)="showSaleForm=true;editingSaleId=null">Add Sale
        </button>
    </div>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>Sale Id</th>
                <th>Product</th>
                <th>Quantity Sold</th>
                <th>Sale Date</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>
            <tr *ngFor="let sale of sales">
                <td>{{ sale.saleId }}</td>
                <td>
                    <ng-container *ngFor="let product of products">
                        <span 
                            *ngIf="product.productId === sale.productId">{{ product.productName }}
                        </span>
                    </ng-container>
                </td>
                <td>{{ sale.quantitySold }}</td>
                <td>{{ sale.saleDate }}</td>
                <td>
                    <button
                        type="button"
                        class="btn btn-warning btn-sm"
                        (click)="editSale(sale)">Edit
                    </button>
                    <button
                        type="button"
                        class="btn btn-danger btn-sm ms-2"
                        (click)="deleteSale(sale.saleId!)">Delete
                    </button>
                </td>
            </tr>

            <tr *ngIf="sales.length ===0">
                <td 
                    colspan="5"
                    class="text-center">No sales found
                </td>
            </tr>
        </tbody>
    </table>

    <div *ngIf="showSaleForm" class="card mt-4">
        <div class="card-body">
            <h4>{{ editingSaleId === null ? 'Add Sale' : 'Edit Sale' }}</h4>

            <form (ngSubmit)="editingSaleId === null ? addSale() : updateSale()">

                <div class="mb-3">
                    <label class="form-label">Product</label>
                    <select 
                        class="form-select"
                        [(ngModel)]="newSale.productId"
                        name="productId"
                        required>
                        <option [ngValue]="0">Select Product</option>
                        <option 
                            *ngFor="let product of products"
                            [ngValue]="product.productId">
                            {{ product.productName }}                        
                        </option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Quantity Sold</label>
                    <input 
                        type="number"
                        class="form-control"
                        [(ngModel)]="newSale.quantitySold"
                        name="quantitySold"
                        min="1"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Sale Date</label>
                    <input 
                        type="date"
                        class="form-control"
                        [(ngModel)]="newSale.saleDate"
                        name="saleDate"
                        required>
                </div>

                <button
                    type="submit"
                    class="btn btn-primary">{{ editingSaleId === null ? 'Add Sale' : 'Update Sale'}}
                </button>

                <button
                    type="button"
                    class="btn btn-secondary ms-2"
                    (click)="cancelEdit()">Cancel
                </button>
            </form>
        </div>
    </div>
</div>
